# Todo dia, consulta a nota e o número de avaliações da Pearle no Google (API oficial),
# gera o site de novo e publica só se algo mudou (ou uma vez por mês, para a rotina
# não ser desligada pelo GitHub). A chave fica no segredo PLACES_API_KEY do repositório.
name: Avaliações do Google

on:
  schedule:
    - cron: "17 9 * * *"     # 06:17 em Brasília
  workflow_dispatch:          # botão "Run workflow" para rodar na hora

permissions:
  contents: write

concurrency:
  group: avaliacoes-google
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Consultar o Google
        env:
          PLACES_API_KEY: ${{ secrets.PLACES_API_KEY }}
        run: python3 tools/atualizar_google.py

      - name: Gerar o site
        run: python3 tools/build.py

      - name: Publicar se mudou
        run: |
          if git diff --quiet; then
            echo "Nada mudou."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/dados.json docs
          git commit -m "Atualiza nota e avaliações do Google (rotina diária)"
          git push
